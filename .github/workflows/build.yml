name: Build and push images

on:
  push:
  pull_request:
  schedule:
    # Weekly rebuild to pick up security updates from base images and distributions.
    # Cron cannot read variables, so it fires daily and the check-day job
    # lets only one day through: Monday by default, or the DAY variable.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-day:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.day.outputs.run }}
    steps:
      - id: day
        env:
          EVENT: ${{ github.event_name }}
          # Optional override: set a repository variable DAY to the weekday of
          # the scheduled rebuild, cron-style: 0 or 7 = Sunday, 1 = Monday … 6 = Saturday.
          # (Settings → Secrets and variables → Actions → Variables)
          DAY: ${{ vars.DAY || '1' }}
        run: |
          if [ "$EVENT" != schedule ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$DAY" in
            [0-7]) ;;
            *) echo "::error::DAY must be a number from 0 to 7, got '$DAY'"; exit 1 ;;
          esac
          [ "$DAY" = 0 ] && DAY=7      # date +%u uses 7 for Sunday
          today="$(date -u +%u)"
          if [ "$today" = "$DAY" ]; then run=true; else run=false; fi
          echo "Today is day $today, scheduled day is $DAY: run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  build:
    needs: check-day
    if: needs.check-day.outputs.run == 'true'
    name: ${{ matrix.tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag:
          - alpine
          - bookworm
          - centos6
          - centos7
          - jammy
          - noble
          - rockylinux8
          - rockylinux9
          - rockylinux10
          - trixie
        include:
          # Rocky 9 is the only image also built for PPC.
          - tag: rockylinux9
            platforms: linux/amd64,linux/ppc64le
    env:
      # Push only from the default branch or on manual runs, never from pull requests.
      PUSH: ${{ github.event_name == 'workflow_dispatch' || (github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute image name
        env:
          # Optional override: set a repository variable IMAGE_NAME
          # (Settings → Secrets and variables → Actions → Variables)
          IMAGE_NAME_OVERRIDE: ${{ vars.IMAGE_NAME }}
        run: |
          repo="${GITHUB_REPOSITORY#*/}"                           # dalibo/docker-buildpack → docker-buildpack
          name="${IMAGE_NAME_OVERRIDE:-${repo#docker-}}"           # docker-buildpack → buildpack
          owner="${GITHUB_REPOSITORY_OWNER,,}"                     # lowercase, ghcr.io requires it
          echo "IMAGE=ghcr.io/${owner}/${name,,}" >> "$GITHUB_ENV" # IMAGE=ghcr.io/dalibo/buildpack

      - uses: docker/setup-qemu-action@v4
        if: contains(matrix.platforms, 'ppc64le')
        with:
          platforms: ppc64le

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No layer cache on purpose: each build must fetch current packages,
      # including security fixes.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.${{ matrix.tag }}
          platforms: ${{ matrix.platforms || 'linux/amd64' }}
          pull: true
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ env.IMAGE }}:${{ matrix.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
