name: Build and push images

on:
  push:
  schedule:
    # Weekly rebuild to pick up security updates from base images and distributions.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag:
          - alpine
          - bookworm
          - centos6
          - centos7
          - jammy
          - noble
          - rockylinux8
          - rockylinux9
          - rockylinux10
          - trixie
        include:
          # Rocky 9 is the only image also built for PPC.
          - tag: rockylinux9
            platforms: linux/amd64,linux/ppc64le
    env:
      # Push only from the default branch or on manual runs.
      PUSH: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute image name
        env:
          # Optional override: set a repository variable IMAGE_NAME
          # (Settings → Secrets and variables → Actions → Variables)
          IMAGE_NAME_OVERRIDE: ${{ vars.IMAGE_NAME }}
        run: |
          repo="${GITHUB_REPOSITORY#*/}"                           # dalibo/docker-buildpack → docker-buildpack
          name="${IMAGE_NAME_OVERRIDE:-${repo#docker-}}"           # docker-buildpack → buildpack
          owner="${GITHUB_REPOSITORY_OWNER,,}"                     # lowercase, ghcr.io requires it
          echo "IMAGE=ghcr.io/${owner}/${name,,}" >> "$GITHUB_ENV" # IMAGE=ghcr.io/dalibo/buildpack

      - uses: docker/setup-qemu-action@v4
        if: contains(matrix.platforms, 'ppc64le')
        with:
          platforms: ppc64le

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No layer cache on purpose: each build must fetch current packages,
      # including security fixes.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.${{ matrix.tag }}
          platforms: ${{ matrix.platforms || 'linux/amd64' }}
          pull: true
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ env.IMAGE }}:${{ matrix.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
