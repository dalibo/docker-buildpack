name: Build and push images

on:
  push:
  pull_request:
  schedule:
    # Weekly rebuild to pick up security updates from base images and distributions.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.tag }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag:
          - alpine
          - bookworm
          - centos6
          - centos7
          - jammy
          - noble
          - rockylinux8
          - rockylinux9
          - rockylinux10
          - trixie
    env:
      # Push only from the default branch or on manual runs, never from pull requests.
      PUSH: ${{ github.event_name == 'workflow_dispatch' || (github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/buildpack" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No layer cache on purpose: each build must fetch current packages,
      # including security fixes.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.${{ matrix.tag }}
          platforms: linux/amd64
          pull: true
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.image.outputs.name }}:${{ matrix.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
